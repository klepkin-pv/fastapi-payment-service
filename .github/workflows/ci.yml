name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: dependencies
        run: uv sync --frozen --project backend
      - name: lint
        run: uv run --project backend ruff check --config backend/pyproject.toml backend database
      - name: format
        run: uv run --project backend ruff format --check --config backend/pyproject.toml backend database
      - name: tests
        run: uv run --project backend pytest -q backend/tests
